name: Build SecureBridge APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild source archive
        run: |
          cat source_b64/part* > SecureBridge-android-v0.5.0-alpha.zip.b64
          base64 --decode SecureBridge-android-v0.5.0-alpha.zip.b64 > SecureBridge-android-v0.5.0-alpha.zip
          unzip -q SecureBridge-android-v0.5.0-alpha.zip
          test -f securebridge_android/settings.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35 SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: securebridge_android
        run: gradle --no-daemon assembleDebug

      - name: Copy APK and calculate SHA-256
        run: |
          cp securebridge_android/app/build/outputs/apk/debug/app-debug.apk SecureBridge-v0.5.0-alpha-debug.apk
          sha256sum SecureBridge-v0.5.0-alpha-debug.apk | tee SecureBridge-v0.5.0-alpha-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureBridge-v0.5.0-alpha-debug-apk
          path: |
            SecureBridge-v0.5.0-alpha-debug.apk
            SecureBridge-v0.5.0-alpha-debug.apk.sha256
          if-no-files-found: error
