name: Build SecureBridge APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      SECUREBRIDGE_ALLOWED_ORIGIN: ${{ secrets.SECUREBRIDGE_ALLOWED_ORIGIN }}
      SECUREBRIDGE_ALLOWED_PATH: ${{ secrets.SECUREBRIDGE_ALLOWED_PATH }}
      SECUREBRIDGE_API_URL: ${{ secrets.SECUREBRIDGE_API_URL }}
      SECUREBRIDGE_DEPLOYMENT_ID: ${{ secrets.SECUREBRIDGE_DEPLOYMENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report deployment mode
        run: |
          configured=0
          for name in SECUREBRIDGE_ALLOWED_ORIGIN SECUREBRIDGE_ALLOWED_PATH SECUREBRIDGE_API_URL SECUREBRIDGE_DEPLOYMENT_ID
          do
            if [ -n "${!name}" ]; then configured=$((configured + 1)); fi
          done

          if [ "$configured" -eq 0 ]; then
            echo "Building generic locked debug APK."
          elif [ "$configured" -eq 4 ]; then
            echo "Building personalized debug APK."
          else
            echo "Incomplete deployment configuration." >&2
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35 SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build and test
        run: gradle --no-daemon test assembleDebug

      - name: Copy APK and calculate SHA-256
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SecureBridge-v0.5.1-alpha-debug.apk
          sha256sum SecureBridge-v0.5.1-alpha-debug.apk | tee SecureBridge-v0.5.1-alpha-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureBridge-v0.5.1-alpha-debug-apk
          path: |
            SecureBridge-v0.5.1-alpha-debug.apk
            SecureBridge-v0.5.1-alpha-debug.apk.sha256
          if-no-files-found: error
